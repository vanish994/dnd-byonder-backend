services:
  - type: web
    name: dnd-2024-rule-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.rule-engine
    healthCheckPath: /health
    envVars:
      - key: RULE_ENGINE_API_KEY
        generateValue: true
      - key: MIMO_BASE_URL
        value: https://dnd-mimo-narrator.onrender.com
      - key: MIMO_MODEL
        value: mimo-v2.6-flash
      - key: MIMO_TIMEOUT_SECONDS
        value: "30"
      - key: MIMO_API_KEY
        sync: false
