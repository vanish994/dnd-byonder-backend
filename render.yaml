services:
  - type: web
    name: dnd-2024-rule-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.rule-engine
    healthCheckPath: /health
    envVars:
      - key: RULE_ENGINE_API_KEY
        generateValue: true
      - key: NARRATOR_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "512"
      - key: GEMINI_TEMPERATURE
        value: "0.7"
      - key: GEMINI_API_KEY
        sync: false
