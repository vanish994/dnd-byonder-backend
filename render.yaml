services:
  - type: web
    name: dnd-2024-rule-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.rule-engine
    healthCheckPath: /health
    envVars:
      - key: RULE_ENGINE_API_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_API_KEY
        sync: false
