services:
  - type: web
    name: dnd-2024-rule-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.rule-engine
    healthCheckPath: /health
    envVars:
      - key: RULE_ENGINE_API_KEY
        generateValue: true
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
